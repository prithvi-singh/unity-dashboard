name: Trigger auto deployment for unity-dashboard-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/unity-dashboard-api-AutoDeployTrigger-0aa4db47-4648-4063-997d-44c6429ca7fd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: ./Dockerfile
          registryUrl: parivaremindersacr.azurecr.io
          registryUsername: ${{ secrets.UNITYDASHBOARDAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.UNITYDASHBOARDAPI_REGISTRY_PASSWORD }}
          containerAppName: unity-dashboard-api
          resourceGroup: unity-dashboard-rg
          containerAppEnvironment: unity-dashboard-env
          imageToBuild: parivaremindersacr.azurecr.io/unity-dashboard-api:${{ github.sha }}
          environmentVariables: 'ALLOWED_ORIGIN=https://unity-dashboard-six.vercel.app CORS_ALLOW_PATTERN=^https://.*\\.vercel\\.app$'

      # Show the real Container App URL so it can be set on Vercel if needed.
      # Base64-encoded to avoid GitHub secret masking (the FQDN matches the API_URL secret).
      - name: Show API URL
        run: |
          FQDN=$(az containerapp show --name unity-dashboard-api --resource-group unity-dashboard-rg --query "properties.configuration.ingress.fqdn" -o tsv)
          ENCODED=$(echo -n "https://$FQDN" | base64 -w0)
          echo "Set NEXT_PUBLIC_API_URL to: $ENCODED"
          echo "Decode with: echo 'VALUE' | base64 -d"

      # Warm up API cache after deploy so the first real user hits warm cache.
      # 45s sleep: Container Apps typically takes 30–40s to become healthy after image swap.
      - name: Warm up API cache after deploy
        run: |
          echo "Waiting 45s for container to become ready..."
          sleep 45
          echo "Pinging health endpoint..."
          curl -sf "${{ secrets.API_URL }}/api/health" || echo "Health ping failed (non-fatal)"
          echo "Warming overview cache..."
          curl -sf "${{ secrets.API_URL }}/api/overview" || echo "Overview warm failed (non-fatal)"
          echo "Warming issues cache..."
          curl -sf "${{ secrets.API_URL }}/api/issues" || echo "Issues warm failed (non-fatal)"
          echo "Warming monitoring cache..."
          curl -sf "${{ secrets.API_URL }}/api/monitoring" || echo "Monitoring warm failed (non-fatal)"

      # Trigger nightly pre-computation so the persistent cache is ready
      # before the first real user hits the dashboard.
      # The startup warm-up in server.js also handles this, but explicitly
      # triggering here ensures the cache is warm within 2-3 minutes of deploy.
      - name: Trigger cache pre-computation
        run: |
          echo "Triggering cache pre-computation..."
          curl -sf -X POST "${{ secrets.API_URL }}/api/admin/cache/refresh" || echo "Cache refresh trigger failed (server will warm-up on startup)"
          echo "Waiting 60s for pre-computation to complete..."
          sleep 60
          echo "Checking cache status..."
          curl -sf "${{ secrets.API_URL }}/api/admin/cache/status" || echo "Cache status check failed (non-fatal)"
          echo "Cache pre-computation triggered."


