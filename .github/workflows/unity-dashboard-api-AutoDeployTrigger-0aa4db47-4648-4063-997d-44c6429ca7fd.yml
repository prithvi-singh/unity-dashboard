name: Trigger auto deployment for unity-dashboard-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/unity-dashboard-api-AutoDeployTrigger-0aa4db47-4648-4063-997d-44c6429ca7fd.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: ./Dockerfile
          registryUrl: parivaremindersacr.azurecr.io
          registryUsername: ${{ secrets.UNITYDASHBOARDAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.UNITYDASHBOARDAPI_REGISTRY_PASSWORD }}
          containerAppName: unity-dashboard-api
          resourceGroup: unity-dashboard-rg
          containerAppEnvironment: unity-dashboard-env
          imageToBuild: parivaremindersacr.azurecr.io/unity-dashboard-api:${{ github.sha }}
          environmentVariables: 'ALLOWED_ORIGIN=https://unity-dashboard-six.vercel.app CORS_ALLOW_PATTERN=^https://.*\\.vercel\\.app$'

      # Show the real Container App URL so it can be set on Vercel if needed.
      # Base64-encoded to avoid GitHub secret masking (the FQDN matches the API_URL secret).
      - name: Show API URL
        run: |
          FQDN=$(az containerapp show --name unity-dashboard-api --resource-group unity-dashboard-rg --query "properties.configuration.ingress.fqdn" -o tsv)
          ENCODED=$(echo -n "https://$FQDN" | base64 -w0)
          echo "Set NEXT_PUBLIC_API_URL to: $ENCODED"
          echo "Decode with: echo 'VALUE' | base64 -d"

      # Force all ingress traffic to the latest revision. Without this, Azure
      # Container Apps keeps the old revision active and never activates the new
      # one, even after `az containerapp update` creates it.
      - name: Activate latest revision (force traffic)
        run: |
          LATEST=$(az containerapp revision list --name unity-dashboard-api --resource-group unity-dashboard-rg --query "[0].name" -o tsv)
          echo "Latest revision: $LATEST"
          echo "Activating and routing 100% traffic to $LATEST..."
          az containerapp ingress traffic set --name unity-dashboard-api --resource-group unity-dashboard-rg --traffic-weight latest=100 --revision-weight $LATEST=100

      # Wait for new container revision to become healthy. Container Apps can
      # take 3-5 minutes to swap to the new revision after an update. Retry the
      # health endpoint until we see the 'cache' field (proves new revision is live).
      # If it never appears, continue anyway — the warmup will force the new
      # revision to start processing requests.
      - name: Wait for new revision to be healthy
        run: |
          echo "Waiting for new container revision to become healthy..."
          FOUND=0
          for i in $(seq 1 30); do
            echo " Attempt $i/30..."
            RESPONSE=$(curl -s --max-time 10 "${{ secrets.API_URL }}/api/health" 2>/dev/null || echo "")
            if echo "$RESPONSE" | grep -q '"cache"'; then
              echo "New revision is healthy and serving traffic!"
              echo "$RESPONSE"
              FOUND=1
              break
            fi
            echo " Health check response: $RESPONSE"
            if [ $i -lt 30 ]; then sleep 10; fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "WARNING: New revision health not confirmed after 5 min — proceeding anyway"
          fi

      # Warm up API endpoints so the in-memory caches are hot.
      - name: Warm up API endpoints
        run: |
          echo "Warming overview..."
          curl -sf --max-time 30 "${{ secrets.API_URL }}/api/overview" || echo "Overview warm failed (non-fatal)"
          echo "Warming issues..."
          curl -sf --max-time 30 "${{ secrets.API_URL }}/api/issues" || echo "Issues warm failed (non-fatal)"
          echo "Warming monitoring..."
          curl -sf --max-time 30 "${{ secrets.API_URL }}/api/monitoring" || echo "Monitoring warm failed (non-fatal)"

      # Trigger nightly pre-computation so the persistent cache is ready
      # before the first real user hits the dashboard.
      # Retries up to 3 times since the startup warm-up may still be running.
      - name: Trigger cache pre-computation
        run: |
          echo "Triggering cache pre-computation..."
          for i in 1 2 3; do
            echo " Attempt $i/3..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 -X POST "${{ secrets.API_URL }}/api/admin/cache/refresh" 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
              echo "Cache refresh triggered (HTTP $HTTP_CODE)"
              break
            fi
            echo " Cache refresh returned HTTP $HTTP_CODE, retrying in 15s..."
            if [ $i -lt 3 ]; then sleep 15; fi
          done
          echo "Waiting 60s for pre-computation to complete..."
          sleep 60
          echo "Checking cache status..."
          curl -sf --max-time 10 "${{ secrets.API_URL }}/api/admin/cache/status" || echo "Cache status check failed (non-fatal)"
          echo "Cache pre-computation triggered."


